name: Monad clips
on:
  push:
    paths: ['clips/jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clips
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core jq
          pip install -q pillow numpy
      - name: Render new clips
        run: |
          git pull -q
          mkdir -p clips/out
          for f in clips/jobs/*.json; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .json)
            [ -f "clips/out/$id.mp4" ] && continue
            if jq -e .video "$f" >/dev/null; then
              python clipmaker/brand.py --video "$(jq -r .video "$f")" --strap "$(jq -r '.strap // "Proper British. Properly Monad."' "$f")" --out "clips/out/$id.mp4" || echo "failed $id"
            else
              python clipmaker/make_clip.py --images "$(jq -r .images "$f")" --headline "$(jq -r .headline "$f")" --hook "$(jq -r '.hook // "WAIT FOR IT…"' "$f")" --dur "$(jq -r '.dur // 10' "$f")" --out "clips/out/$id.mp4" || echo "failed $id"
              rm -f clips/out/$id.mp4.wav clips/out/$id.mp4.v.mp4
            fi
          done
      - name: Save clips
        run: |
          git config user.name "Barbello" && git config user.email "barbello@users.noreply.github.com"
          git add clips/out
          git diff --cached --quiet || (git commit -m "Rendered clips" && (git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours)) && git push)
